<!DOCTYPE html>
<html>
<head>
    <title>Library Management System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Library Management System</h1>

        <h2>Book Registration</h2>

        <input type="text" id="bookId" placeholder="Book ID">
        <input type="text" id="bookName" placeholder="Book Name">
        <input type="text" id="author" placeholder="Author Name">

        <button onclick="addBook()">Register Book</button>

        
        <h2>Search Book</h2>

        <input type="text" id="search" placeholder="Enter Book Name or Author">

<button onclick="searchBook()">Search</button>
<button onclick="displayBooks()">Show All Books</button>


        <h2>Book Details</h2>

        <table>
            <thead>
                <tr>
                    <th>Book ID</th>
                    <th>Book Name</th>
                    <th>Author</th>
                    <th>Action</th>
                </tr>
            </thead>

            <tbody id="bookList">
            </tbody>
        </table>

    </div>

    <script src="script.js"></script>
</body>
</html>
